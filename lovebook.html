<!DOCTYPE html>
<!-- Bootstrap CSS CDN for styling -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Popper.js and Bootstrap JS for UI components -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.5/dist/umd/popper.min.js" integrity="sha384-"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.min.js" integrity="sha384-"></script>
<!-- Socket.io client library to enable real-time communication -->
<script src="/socket.io/socket.io.js"></script>

<!-- Main Container -->
<div class="container">
    <br>
    <div class="jumbotron">
        <h1 class="display-4">LoveBook</h1>
        <br>
        <!-- Input for sender name -->
        <input id="name" class="form-control" placeholder="Name">
        <br>
        <!-- Textarea for the message content -->
        <textarea id="message" class="form-control" placeholder="Message"></textarea>
        <br>
        <!-- Button to trigger sending the message -->
        <button id="send" class="btn btn-success">Send</button>
    </div>
    <!-- Container where messages will be appended dynamically -->
    <div id="messages">

    </div>
</div>

<!-- jQuery CDN for DOM manipulation and AJAX requests -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
    // Initialize Socket.io client connection
    var socket = io()

    // Run code once the DOM is fully loaded
    $(() => {
        // Set up click event listener for the Send button
        $("#send").click(()=> {
            // Read values from the input fields
            var message = { name: $("#name").val(), message: $("#message").val()}
            // Send the message to the backend via POST
            postMessage(message)
        })
        // Fetch existing messages from the server on initial page load
        getMessages()
    })

    // Listen for real-time 'message' events from the Socket.io server
    socket.on('message', addMessage)

    // Render a single message into the #messages container
    function addMessage(message){
        $("#messages").append(`<h4> ${message.name} </h4> <p> ${message.message} </p>`)
    }

    // HTTP GET request to fetch all stored messages from the server
    function getMessages() {
        $.get('http://localhost:3000/messages', (data) => {
            // Loop through each message and append it to the page
            data.forEach(addMessage);
        })
    }

    // HTTP POST request to send a new message object to the server
    function postMessage(message) {
        $.post('http://localhost:3000/messages', message)
    }
</script>
